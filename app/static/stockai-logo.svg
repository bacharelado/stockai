<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">StockAI</title>
  <desc id="desc">Logo StockAI com robô, caixa e nome StockAI</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19d7f5"/>
      <stop offset="1" stop-color="#0878ff"/>
    </linearGradient>
    <linearGradient id="textBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18d9f5"/>
      <stop offset="1" stop-color="#0878ff"/>
    </linearGradient>
  </defs>
  <g transform="translate(70 35)">
    <!-- antenna -->
    <rect x="515" y="0" width="24" height="82" rx="12" fill="#14c9ef" transform="rotate(14 527 41)"/>
    <rect x="590" y="45" width="24" height="78" rx="12" fill="#13bfe9" transform="rotate(45 602 84)"/>
    <rect x="635" y="145" width="82" height="24" rx="12" fill="#12bce8" transform="rotate(-3 676 157)"/>
    <!-- ears -->
    <path d="M130 245c-42 0-72 32-72 76s30 76 72 76h34V245z" fill="url(#blue)"/>
    <path d="M595 205c40 0 70 30 70 73s-30 73-70 73h-34V205z" fill="url(#blue)"/>
    <!-- robot head -->
    <path d="M135 155C135 91 190 50 270 34L472 0c93-15 169 37 180 111l28 181c8 53-16 92-63 112l-40 17-3 69-151 29-1-62-113 22c-74 14-135-25-149-96z" fill="#f7fbff"/>
    <path d="M190 176c-4-44 26-77 80-88l205-35c54-9 95 19 102 68l26 160c7 39-13 68-51 76l-245 47c-59 11-105-17-113-68z" fill="#071321"/>
    <!-- eyes -->
    <path d="M265 221c18-28 53-30 74-3" fill="none" stroke="#11c9ef" stroke-width="25" stroke-linecap="round"/>
    <path d="M424 188c18-28 53-30 74-3" fill="none" stroke="#11c9ef" stroke-width="25" stroke-linecap="round"/>
    <!-- box -->
    <path d="M383 355l129-57 126 69-130 62z" fill="#18c9f1"/>
    <path d="M383 355v126l125 68V417z" fill="#12aee9"/>
    <path d="M508 417v132l130-70V367z" fill="#087df5"/>
    <path d="M449 328l129 68-65 29-128-69z" fill="#f7fbff"/>
    <path d="M578 396l60-29" stroke="#071321" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="70" y="660" font-family="Arial, Helvetica, sans-serif" font-size="158" font-weight="800" letter-spacing="-7" fill="#f8fafc">STOCK</text>
  <text x="575" y="660" font-family="Arial, Helvetica, sans-serif" font-size="158" font-weight="800" letter-spacing="-7" fill="url(#textBlue)">AI</text>
</svg>