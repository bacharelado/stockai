<header class="topline">
    <div>
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Abrir menu">☰</button>
        <p class="eyebrow">Visão geral</p>
        <h1>Veja seu estoque de forma simples.</h1>
        <p class="subtitle">Aqui você vê seus produtos, os alertas e tudo que entrou ou saiu do estoque.</p>
    </div>

    <div class="top-actions">
        <span class="date-chip" id="today"></span>
        <button class="ghost" id="theme-toggle" type="button" aria-label="Ativar tema escuro">☾ Tema</button>
        <a class="ghost" href="/produtos/exportar.csv">↓ Baixar produtos</a>
        {% if pode_gerenciar %}<button class="primary" id="open-create" type="button">+ Novo produto</button>{% endif %}
        <button class="ghost" id="logout" type="button">Sair</button>
    </div>
</header>
