name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and audit tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit

      - name: Run Bandit
        run: bandit -r app -ll -iii

      - name: Audit Python dependencies
        run: pip-audit
