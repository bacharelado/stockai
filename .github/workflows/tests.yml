name: tests

on:
  push:
    branches: [main, security-hardening-2026-09]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          STOCKAI_ENV: test
          STOCKAI_REQUIRE_AUTH: "false"
          STOCKAI_ADMIN_USERNAME: admin
          STOCKAI_ADMIN_PASSWORD: test-password-for-ci-only
          STOCKAI_SESSION_SECRET: test-session-secret-for-ci-only
          STOCKAI_AUTO_CREATE_SCHEMA: "true"
        run: python -m pytest -q
